<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RAG UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --muted: #94a3b8;
      --accent: #6366f1;
      --text: #e5e7eb;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      padding: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
    }
    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.25rem;
    }
    p.muted { color: var(--muted); }
    form { display: grid; gap: .75rem; margin-top: 1rem; }
    label { font-weight: 600; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: .65rem .75rem;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #0b1220;
      color: var(--text);
      outline: none;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    button {
      background: var(--accent);
      color: white;
      border: 0;
      padding: .7rem 1rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s ease-in-out;
    }
    button:hover {
      opacity: .9;
    }
    .hint { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
    .output { margin-top: 1rem; white-space: pre-wrap; background: #0b1220; border-radius: 10px; padding: .75rem; border: 1px solid #374151; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>RAG Console</h1>
      <p class="muted">Upload text, embed, and chat with your data.</p>

      <form id="embed-form">
        <div class="row">
          <div>
            <label for="chunk_size">Chunk Size</label>
            <input id="chunk_size" name="chunk_size" type="number" min="1" value="{{ default_chunk_size }}" />
            <div class="hint">Size used for text chunking and embedding dimensions.</div>
          </div>
          <div>
            <label for="embedding_model">Embedding Model</label>
            <select id="embedding_model" name="embedding_model">
              <option value="{{ embedding_model }}" selected>{{ embedding_model }}</option>
              <option value="text-embedding-3-small">text-embedding-3-small</option>
              <option value="text-embedding-3-large">text-embedding-3-large</option>
            </select>
            <div class="hint">OpenAI text-embedding-3 models support a custom <code>dimensions</code> value.</div>
          </div>
        </div>

        <div>
          <label for="database">Logical Database Label (optional)</label>
          <input id="database" name="database" type="text" placeholder="ex: sales_2024_q3" value="{{ pg_database or '' }}" />
        </div>

        <div>
          <label for="text">Text</label>
          <textarea id="text" name="text" placeholder="Paste content to embed..."></textarea>
        </div>

        <div>
          <button type="submit">Embed</button>
        </div>
      </form>

      <div id="result" class="output" hidden></div>
    </div>
  </div>

  <script>
    const DEFAULT_CHUNK_SIZE = {{ default_chunk_size }};
    const PG_DATABASE = "{{ pg_database }}";
    const DEFAULT_EMBEDDING_MODEL = "{{ embedding_model }}";

    const result = document.getElementById("result");
    document.getElementById("embed-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        chunk_size: Number(document.getElementById("chunk_size").value || DEFAULT_CHUNK_SIZE),
        embedding_model: document.getElementById("embedding_model").value || DEFAULT_EMBEDDING_MODEL,
        database: document.getElementById("database").value || null,
        text: document.getElementById("text").value || ""
      };

      try {
        result.hidden = false;
        result.textContent = "Embedding...";
        const resp = await fetch("/api/v1/vectors/embed", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = String(err);
      }
    });
  </script>
</body>
</html>
